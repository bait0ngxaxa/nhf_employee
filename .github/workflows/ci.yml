name: Disposable Routine Performance Profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Baseline Routine work items
        run: |
          files=(modules/routine/application/queries.ts modules/routine/domain/timing.ts)
          for file in "${files[@]}"; do
            git show 62ef4abb51fb6351ba1e06b67932395f77d2b320:"$file" > "$file"
          done
          node scripts/run-mysql-integration-tests.mjs --profile-routine
      - name: Candidate Routine work items
        run: |
          for file in modules/routine/application/queries.ts modules/routine/domain/timing.ts; do
            git show HEAD:"$file" > "$file"
          done
          node scripts/run-mysql-integration-tests.mjs --profile-routine
      - name: Verify disposable cleanup
        if: always()
        run: node scripts/run-mysql-integration-tests.mjs --cleanup
