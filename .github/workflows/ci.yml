name: Disposable Routine Performance Profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Compare original and candidate Scheduler
        shell: bash
        run: |
          set -euo pipefail
          git show f913204e57d576d74c06e252f76e4cb19bcd3165:modules/routine/application/generation.ts > modules/routine/application/generation.ts
          git show f913204e57d576d74c06e252f76e4cb19bcd3165:modules/routine/domain/schedule.ts > modules/routine/domain/schedule.ts
          node scripts/run-mysql-integration-tests.mjs --profile-scheduler | tee /tmp/routine-scheduler-baseline.log
          git restore -- modules/routine/application/generation.ts modules/routine/domain/schedule.ts
          node scripts/run-mysql-integration-tests.mjs --profile-scheduler | tee /tmp/routine-scheduler-candidate.log
          node scripts/compare-routine-scheduler-profiles.mjs /tmp/routine-scheduler-{baseline,candidate}.log |
            sed 's/^/SCHEDULER_COMPARISON /'
      - name: Verify disposable cleanup
        if: always()
        run: node scripts/run-mysql-integration-tests.mjs --cleanup
