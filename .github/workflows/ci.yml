name: Disposable Routine Performance Profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Profile IT resolution index
        run: node scripts/run-mysql-integration-tests.mjs --profile-routine
      - name: Verify disposable cleanup
        if: always()
        run: node scripts/run-mysql-integration-tests.mjs --cleanup
