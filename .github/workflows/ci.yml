name: Disposable IT resolution benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Run isolated benchmark
        env:
          TZ: UTC
          NHF_IT_RESOLUTION_SIZE: '100000'
        run: |
          set +e
          npm run test:integration:mysql -- --profile-it-resolution > it-benchmark.log 2>&1
          status=$?
          tail -n 5 it-benchmark.log | cut -c 1-160
          sed -n 's/^IT_RESOLUTION_PROFILE //p' it-benchmark.log > it-historical-resolution-hosted.jsonl
          exit "$status"
      - name: Verify cleanup
        if: always()
        run: node scripts/run-mysql-integration-tests.mjs --cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: it-resolution-benchmark
          path: it-historical-resolution-hosted.jsonl
          if-no-files-found: error

